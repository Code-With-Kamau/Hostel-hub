<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HostelHub — Kenya's Student Hostel Finder</title>
  <meta name="description" content="Find, book and pay for verified student hostels near Kenyan universities via M-Pesa.">
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>

  <!-- Navbar -->
  <nav id="navbar" class="navbar"></nav>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Main Content -->
  <main id="main-content" class="main-content"></main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="brand-icon">🎓</span>
        <span class="brand-text">HostelHub</span>
        <p>The smart way for Kenyan students to find, book and pay for verified hostels.</p>
      </div>
      <div class="footer-links">
        <div>
          <h4>Students</h4>
          <a href="#home">Browse Hostels</a>
          <a href="#dashboard">My Bookings</a>
          <a href="#community">Roommate Finder</a>
        </div>
        <div>
          <h4>Owners</h4>
          <a href="#owner">List a Hostel</a>
          <a href="#owner">Manage Bookings</a>
        </div>
        <div>
          <h4>Support</h4>
          <a href="mailto:support@hostelhub.co.ke">support@hostelhub.co.ke</a>
          <a href="tel:+254700000001">+254 700 000 001</a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; <span id="footer-year"></span> HostelHub. Built for Kenyan students 🇰🇪</p>
    </div>
  </footer>

  <!-- Socket.io CDN -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- Core JS — load order matters -->
  <script src="/js/config.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/app.js"></script>

  <!-- Page scripts (must come after app.js which defines registerPage) -->
  <script src="/js/pages/home.js"></script>
  <script src="/js/pages/hostel-detail.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/owner.js"></script>
  <script src="/js/pages/university.js"></script>
  <script src="/js/pages/admin-page.js"></script>
  <script src="/js/chat.js"></script>

  <!-- Google Maps (async) -->
  <script>
    window.initMap = function() { if (window.HHMap) HHMap.init(); };
  </script>
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=GOOGLE_MAPS_API_KEY_PLACEHOLDER&libraries=places&callback=initMap">
  </script>

  <script>
    // Inject real Maps API key from meta tag (set by server if needed), or let it default
    document.getElementById('footer-year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
